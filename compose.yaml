# Local development infrastructure for ProjectY.
# Credentials here are for local use only.
name: projecty

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: projecty
      POSTGRES_PASSWORD: projecty
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecty -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"
      - "1025:1025"
    labels:
      org.springframework.boot.ignore: "true"

volumes:
  postgres-data:
