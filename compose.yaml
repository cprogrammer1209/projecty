# Local development for ProjectY.
# Credentials here are for local use only.
#   docker compose up -d                    infrastructure only (run the services and Angular apps from the host)
#   docker compose --profile apps up --build   infrastructure plus all four apps in containers
# Stop host-run copies first: the apps use the same ports (4200, 4300, 8081, 8082).
name: projecty

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: projecty
      POSTGRES_PASSWORD: projecty
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecty -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"
      - "1025:1025"
    labels:
      org.springframework.boot.ignore: "true"

  # Single-node Kafka in KRaft mode (broker and controller in one process, no ZooKeeper).
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for the host (services run with mvnw), INTERNAL is for containers on the compose network.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by platform-service at startup, so a mistyped topic fails instead of appearing.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    labels:
      org.springframework.boot.ignore: "true"

  kafka-console:
    image: redpandadata/console:v2.8.0
    # Host network: Kafka advertises localhost:9092, which a bridged container could not reach.
    network_mode: host
    environment:
      KAFKA_BROKERS: localhost:9092
      SERVER_LISTENPORT: 8088
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      org.springframework.boot.ignore: "true"

  # ---- Apps: only started with --profile apps ----

  platform-service:
    profiles: ["apps"]
    build: ./platform-service
    ports:
      - "8081:8081"
    environment: &service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/platform
      SPRING_MAIL_HOST: mailpit
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_USERNAME: projecty
      SPRING_DATASOURCE_PASSWORD: projecty
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Same-origin through the frontend containers' nginx, so the browser URL is localhost:4200.
      PROJECTY_TOKEN_ISSUER: http://localhost:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    labels:
      org.springframework.boot.ignore: "true"

  work-service:
    profiles: ["apps"]
    build: ./work-service
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/work
      PROJECTY_TOKEN_JWK_SET_URI: http://platform-service:8081/.well-known/jwks.json
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      platform-service:
        condition: service_healthy
    labels:
      org.springframework.boot.ignore: "true"

  frontend:
    profiles: ["apps"]
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - platform-service
      - work-service
    labels:
      org.springframework.boot.ignore: "true"

  admin-console:
    profiles: ["apps"]
    build: ./admin-console
    ports:
      - "4300:80"
    depends_on:
      - platform-service
    labels:
      org.springframework.boot.ignore: "true"

volumes:
  postgres-data:
  kafka-data:
