# Local development infrastructure for ProjectY.
# Credentials here are for local use only.
name: projecty

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: projecty
      POSTGRES_PASSWORD: projecty
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecty -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"
      - "1025:1025"
    labels:
      org.springframework.boot.ignore: "true"

  # Single-node Kafka in KRaft mode (broker and controller in one process, no ZooKeeper).
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by platform-service at startup, so a mistyped topic fails instead of appearing.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    labels:
      org.springframework.boot.ignore: "true"

  kafka-console:
    image: redpandadata/console:v2.8.0
    # Host network: Kafka advertises localhost:9092, which a bridged container could not reach.
    network_mode: host
    environment:
      KAFKA_BROKERS: localhost:9092
      SERVER_LISTENPORT: 8088
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      org.springframework.boot.ignore: "true"

volumes:
  postgres-data:
  kafka-data:
