<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · ProjectY</title>
<style>
:root{--bg:#f5f8fa;--card:#fff;--bd:#cbd6e2;--bd2:#dfe3eb;--tx:#33475b;--tx2:#516f90;--tx3:#7c98b6;--or:#ff7a59;--or2:#ff8f73;--ord:#e8613f;--tint:#fff1ee;--lk:#0091ae;--navy:#2d3e50;--side:#fff;--ok:#00a38d;--err:#f2545b;--warn:#f5c26b;--blue:#eaf0f6;--r:6px;--top:52px}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;color:#2d3e50;line-height:1.25}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}h4{font-size:14px}
p{margin:0}
a{color:var(--lk);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #00a4bd;outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* top bar */
.top{position:sticky;top:0;z-index:50;height:var(--top);background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
.logo{font-weight:700;font-size:18px;letter-spacing:.2px;color:#fff}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--or);margin-right:6px}
.top .sep{width:1px;height:22px;background:#516f90}
.top .lab{font-size:14px;color:#cbd6e2}
.burger{display:none;background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
.search{position:relative;margin-left:auto;width:320px;max-width:40vw}
.search input{width:100%;height:34px;border-radius:17px;border:1px solid #516f90;background:#3a4d63;color:#fff;padding:0 14px}
.search input::placeholder{color:#b0c1d4}
.search input:focus{background:#fff;color:var(--tx);outline:2px solid #00a4bd}
.sres{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 6px 20px rgba(45,62,80,.2);padding:6px;color:var(--tx)}
.sres a{display:block;padding:7px 10px;border-radius:4px;color:var(--tx)}
.sres a small{display:block;color:var(--tx3)}
.sres a:hover,.sres a.hi{background:var(--blue);text-decoration:none}
.sres p{padding:8px 10px;color:var(--tx3)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--or);color:#fff;border:0;font-weight:700;font-size:12px;cursor:pointer}
/* shell */
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - var(--top))}
.side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--bd2);position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;padding:14px 10px}
.ngh{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;text-align:left;cursor:pointer;padding:7px 8px;border-radius:4px;font-weight:600;color:#2d3e50}
.ngh:hover{background:var(--bg)}
.ngh.l2{font-weight:600;color:var(--tx2);font-size:13px;padding-left:20px}
.chev{width:7px;height:7px;border-right:2px solid var(--tx2);border-bottom:2px solid var(--tx2);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px;flex:none}
.ngh[aria-expanded=true]>.chev{transform:rotate(45deg)}
.ngb{padding:2px 0 8px}
.nl{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px 7px 28px;margin:1px 0;border-radius:4px;color:var(--tx);border-left:3px solid transparent}
.ngb .ngb .nl{padding-left:42px}
.nl:hover{background:var(--bg);text-decoration:none}
.nl.cur{background:var(--blue);border-left-color:var(--or);font-weight:600;color:#2d3e50}
.soon{font-size:11px;font-weight:600;background:#eaf0f6;color:var(--tx2);border-radius:10px;padding:0 8px}
.backdrop{display:none}
.main{flex:1;min-width:0;padding:20px 32px 60px}
.crumbs{font-size:13px;color:var(--tx2);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs span+span:before{content:"/";margin-right:6px;color:var(--tx3)}
.page{max-width:1180px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.phead p{color:var(--tx2);margin-top:4px;max-width:640px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:14px 0 20px;overflow-x:auto}
.tabs a,.tabs span{padding:10px 16px;color:var(--tx2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs a:hover{color:#2d3e50;text-decoration:none}
.tabs a.cur{color:#2d3e50;border-bottom-color:var(--or);font-weight:600}
.tabs span{color:#a9bbcf;cursor:not-allowed}
/* components */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--r);border:1px solid #516f90;background:#fff;color:#2d3e50;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.btn.pri:hover{background:var(--or2)}
.btn.dng{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--lk);cursor:pointer;padding:0;font-weight:500}
.link:hover{text-decoration:underline}
.ib{width:30px;height:30px;border-radius:4px;border:0;background:none;cursor:pointer;color:var(--tx2);font-size:16px;line-height:1;display:inline-grid;place-items:center}
.ib:hover{background:var(--blue);color:#2d3e50}
.ib:disabled{opacity:.35;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px}
.pill{display:inline-block;border-radius:12px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--blue);color:var(--tx2);white-space:nowrap}
.pill.ok{background:#e5f8f6;color:#00826f}
.pill.off{background:#eaf0f6;color:#7c98b6}
.pill.or{background:var(--tint);color:#c4482a}
.pill.dflt{background:#e5f5f8;color:#00758d}
.chip{display:inline-block;border-radius:12px;padding:0 9px;font-size:12px;background:#eaf0f6;color:var(--tx2);white-space:nowrap}
.chip.o{background:var(--tint);color:#c4482a}
.chip.w{background:#fef3dc;color:#8a5a00}
.tw{position:relative;background:#fff;border:1px solid var(--bd);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--bg);text-align:left;font-size:12px;font-weight:600;color:var(--tx2);padding:10px 14px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--bd2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafcfd}
td .sub{color:var(--tx3);font-size:12px}
.num{text-align:right}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.inp,.sel{height:36px;border:1px solid var(--bd);border-radius:var(--r);padding:0 12px;background:#fff;min-width:0}
textarea.inp{height:auto;padding:8px 12px}
.inp:hover,.sel:hover{border-color:#99aebe}
.inp:focus,.sel:focus{outline:2px solid #00a4bd;outline-offset:0;border-color:#00a4bd}
.note{color:var(--tx2);font-size:13px}
.mwrap{position:relative;display:inline-block}
.menu{position:fixed;z-index:80;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 6px 24px rgba(45,62,80,.22);padding:6px;min-width:170px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:4px;cursor:pointer;color:var(--tx)}
.menu button:hover{background:var(--blue)}
.menu button.d{color:var(--err)}
.menu button:disabled{opacity:.4;cursor:not-allowed}
.alert{border-radius:var(--r);padding:10px 14px;margin:0 0 14px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.alert.err{background:#fdedee;border-color:#f2545b;color:#8f1d24}
.alert.warn{background:#fef8f0;border-color:var(--warn);color:#6b4a00}
.form{max-width:640px;padding:24px;display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fl{display:grid;gap:6px;font-weight:600;color:#2d3e50}
.fl .inp,.fl .sel{font-weight:400;width:100%}
.fl small{font-weight:400;color:var(--tx3)}
.chk{display:flex;align-items:center;gap:8px;font-weight:400}
.chk input{width:16px;height:16px;accent-color:var(--or)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast div{background:var(--navy);color:#fff;padding:10px 18px;border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.25);border-left:4px solid var(--ok);max-width:90vw}
.toast div.err{border-left-color:var(--err)}
dialog.dlg{border:0;border-radius:8px;padding:0;width:min(480px,calc(100vw - 24px));box-shadow:0 12px 48px rgba(45,62,80,.4);color:var(--tx)}
dialog.dlg::backdrop{background:rgba(45,62,80,.55)}
dialog.dlg header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--navy);color:#fff;border-radius:8px 8px 0 0}
dialog.dlg header h2{color:#fff;font-size:16px}
dialog.dlg header .ib{color:#fff}
.dlg-b{padding:20px;display:grid;gap:14px}
dialog.dlg footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--bd2);background:var(--bg);border-radius:0 0 8px 8px}
.dlg-err{color:#8f1d24;background:#fdedee;border-radius:4px;padding:8px 12px}
.radios{display:grid;gap:8px}
/* builder */
.bhead{position:sticky;top:var(--top);z-index:30;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;box-shadow:0 2px 8px rgba(45,62,80,.08)}
.bhead .nm{font-size:18px;font-weight:600;border:1px solid transparent;border-radius:var(--r);padding:4px 10px;min-width:0;flex:1 1 200px;max-width:380px;background:transparent;color:#2d3e50}
.bhead .nm:hover{border-color:var(--bd)}
.bhead .nm:focus{border-color:#00a4bd;background:#fff}
.bhead .sp{flex:1}
.dirty{color:#c4482a;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.dirty:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--or)}
.seg{display:inline-flex;border:1px solid #516f90;border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:#fff;padding:0 16px;height:34px;cursor:pointer;font-weight:600;color:var(--tx2)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.sec{margin-bottom:16px;transition:box-shadow .15s,border-color .15s}
.sec.over,.avail.over{border-color:var(--lk);box-shadow:0 0 0 3px rgba(0,145,174,.18)}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd2);flex-wrap:wrap}
.sec-name{font-weight:600;font-size:15px;border:1px solid transparent;border-radius:var(--r);padding:5px 8px;flex:1 1 160px;min-width:0;background:transparent;color:#2d3e50}
.sec-name:hover{border-color:var(--bd)}
.sec-name:focus{border-color:#00a4bd;background:#fff}
.tg{display:inline-flex;align-items:center;gap:6px;color:var(--tx2);font-size:13px;cursor:pointer}
.tg input{accent-color:var(--or);width:16px;height:16px}
.sec-b{padding:12px;min-height:64px;display:grid;gap:8px;align-content:start}
.empty{border:2px dashed var(--bd);border-radius:var(--r);color:var(--tx3);text-align:center;padding:16px;font-size:13px}
.fitem{border:1px solid var(--bd2);border-radius:var(--r);background:#fff}
.fitem.open{border-color:var(--lk)}
.frow{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:grab;flex-wrap:wrap}
.frow:active{cursor:grabbing}
.frow.dragging{opacity:.55;box-shadow:0 8px 20px rgba(45,62,80,.25)}
.grip{color:var(--tx3);letter-spacing:-2px;font-size:16px;user-select:none}
.fmain{flex:1 1 150px;min-width:0;background:none;border:0;text-align:left;cursor:pointer;padding:2px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fmain b{font-weight:600;color:#2d3e50}
.fmain .ty{color:var(--tx3);font-size:12px}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.mv{height:30px;font-size:12px;max-width:150px;border:1px solid var(--bd);border-radius:4px;background:#fff;padding:0 6px}
.fedit{border-top:1px solid var(--bd2);background:#fafcfd;padding:14px 16px;display:grid;gap:12px;border-radius:0 0 6px 6px}
.fedit .fl{font-weight:500}
.addsec{width:100%;border:2px dashed var(--bd);background:transparent;border-radius:8px;padding:18px;color:var(--lk);font-weight:600;cursor:pointer}
.addsec:hover{background:#fff;border-color:var(--lk)}
.avail{position:sticky;top:calc(var(--top) + 84px);padding:16px;display:grid;gap:12px}
.avlist{display:grid;gap:8px;max-height:52vh;overflow-y:auto;padding:2px}
.avail .frow{padding:7px 9px}
.prev{display:grid;gap:16px;max-width:860px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;padding:16px}
.sm-ctl{display:grid;gap:6px}
.sm-lab{font-weight:600;color:#2d3e50;font-size:13px}
.sm-req{color:var(--err)}
.sm-ro{font-weight:500;font-size:11px;background:#eaf0f6;color:var(--tx2);border-radius:10px;padding:0 7px;margin-left:4px}
.sm-ctl input[type=text],.sm-ctl input[type=number],.sm-ctl input[type=date],.sm-ctl select,.sm-ctl textarea{border:1px solid var(--bd);border-radius:var(--r);padding:7px 12px;background:#fff;width:100%;min-width:0}
.sm-ctl input:disabled,.sm-ctl select:disabled,.sm-ctl textarea:disabled{background:#eaf0f6;color:var(--tx2)}
.sm-check{display:flex;align-items:center;gap:8px;font-weight:400}
.sm-check input{accent-color:var(--or)}
.sm-multi{display:flex;flex-wrap:wrap;gap:6px 16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.grp{margin-bottom:20px}
.grp h3{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.sw i{position:absolute;inset:0;background:#cbd6e2;border-radius:11px;transition:.15s;pointer-events:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{left:21px}
.sw input:focus-visible+i{outline:2px solid #00a4bd;outline-offset:2px}
.pref{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--bd2)}
.pref:last-child{border-bottom:0}
.pref p{color:var(--tx2);font-size:13px}
.ph{padding:40px 24px;text-align:center;color:var(--tx2);display:grid;gap:8px;justify-items:center}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cards3 .card{padding:16px}
@media(max-width:1000px){.bgrid{grid-template-columns:1fr}.avail{position:static}}
@media(max-width:800px){
 .burger{display:block}.top .lab,.top .sep{display:none}.search{width:auto;flex:1;max-width:none}
 .side{position:fixed;left:0;top:var(--top);bottom:0;height:auto;z-index:70;transform:translateX(-102%);transition:transform .2s;}
 .side.open{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.2)}
 .backdrop.open{display:block;position:fixed;inset:var(--top) 0 0 0;background:rgba(45,62,80,.45);z-index:60}
 .main{padding:16px 14px 60px}
 .row2,.pgrid{grid-template-columns:1fr}
 h1{font-size:21px}
 .bhead .nm{max-width:none}
}
</style>
</head>
<body>
<header class="top">
 <button class="burger" data-act="drawer" aria-label="Open navigation" aria-expanded="false">&#9776;</button>
 <a class="logo" href="#/projects/layouts"><i></i>ProjectY</a>
 <span class="sep"></span><span class="lab">Settings</span>
 <div class="search" role="search">
  <input id="gs" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off">
  <div class="sres" id="sres" hidden></div>
 </div>
 <button class="avatar" aria-label="Account menu for Priya Nair">PN</button>
</header>
<div class="shell">
 <nav class="side" id="side" aria-label="Settings navigation"></nav>
 <div class="backdrop" id="bd" data-act="drawer"></div>
 <main class="main" id="main">
  <div class="crumbs" id="crumbs" aria-label="Breadcrumb"></div>
  <div class="page" id="view"></div>
 </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="settings-model.js"></script>
<script>
const h = SM.esc, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const view = $('#view');
const S = { open: { account: true, data: true, modules: true }, B: null, ignore: false, fq: '', prefs: { digest: true, mentions: true, compact: false, beta: false } };
const MODS = () => SM.modules;
const PAGES = [
  { t: 'Portal profile', k: 'name time zone currency date format', h: '#/portal', g: 'Account Setup' },
  { t: 'Users & profiles', k: 'people invite roles permissions', h: '#/users', g: 'Account Setup' },
  { t: 'Audit log', k: 'history changes activity', h: '#/audit', g: 'Account Setup' },
  { t: 'My preferences', k: 'notifications toggles', h: '#/preferences', g: 'Account Setup' },
  { t: 'Projects: Fields', k: 'properties custom', h: '#/projects/fields', g: 'Modules' },
  { t: 'Projects: Layouts', k: 'layout builder sections record', h: '#/projects/layouts', g: 'Modules' },
  { t: 'Projects: Statuses', k: 'status', h: '#/projects/statuses', g: 'Modules' },
  { t: 'Projects: Templates', k: 'template', h: '#/projects/templates', g: 'Modules' },
  { t: 'Tasks', k: 'soon', h: '#/tasks', g: 'Modules' }, { t: 'Issues', k: 'soon bugs', h: '#/issues', g: 'Modules' },
  { t: 'Documents', k: 'soon files', h: '#/documents', g: 'Modules' }, { t: 'Time tracking', k: 'soon timesheets', h: '#/time', g: 'Modules' },
];
const DEFAULT = '#/projects/layouts';

/* ---------- helpers ---------- */
function toast(msg, err) {
  const d = document.createElement('div'); if (err) d.className = 'err'; d.textContent = msg; $('#toast').append(d);
  setTimeout(() => d.remove(), err ? 5000 : 3200);
}
function dlg({ title, body, ok = 'Save', danger = false, cancel = 'Cancel', onOk }) {
  const d = document.createElement('dialog'); d.className = 'dlg';
  d.setAttribute('aria-label', title);
  d.innerHTML = `<form method="dialog" novalidate><header><h2>${h(title)}</h2><button type="button" class="ib" data-close aria-label="Close dialog">&#10005;</button></header><div class="dlg-b">${body}<p class="dlg-err" role="alert" hidden></p></div><footer><button type="button" class="btn" data-close>${h(cancel)}</button><button type="submit" class="btn ${danger ? 'dng' : 'pri'}">${h(ok)}</button></footer></form>`;
  document.body.append(d); d.showModal();
  d.addEventListener('close', () => d.remove());
  $$('[data-close]', d).forEach((b) => b.onclick = () => d.close());
  $('form', d).onsubmit = (e) => {
    e.preventDefault();
    const err = onOk($('form', d), d);
    if (err) { const p = $('.dlg-err', d); p.textContent = err; p.hidden = false; } else d.close();
  };
  const f = $('input:not([type=radio]),select', d); if (f) f.focus();
  return d;
}
const confirmDlg = (title, text, ok, onOk, danger = true) => dlg({ title, body: `<p>${h(text)}</p>`, ok, danger, onOk: () => { onOk(); } });
const typeOpts = () => SM.TYPES.map(([v, l]) => `<option value="${v}">${h(l)}</option>`).join('');
function menuHtml(label, items) {
  return `<div class="mwrap"><button class="ib" data-menu aria-haspopup="menu" aria-expanded="false" aria-label="${h(label)}">&#8943;</button><div class="menu" role="menu" hidden>${items.map((i) => `<button role="menuitem" class="${i.d ? 'd' : ''}" ${i.dis ? 'disabled' : ''} ${i.attrs}>${h(i.t)}</button>`).join('')}</div></div>`;
}
const closeMenus = () => $$('.menu').forEach((m) => { m.hidden = true; m.previousElementSibling?.setAttribute('aria-expanded', 'false'); });

/* ---------- routing ---------- */
function parse() {
  const p = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  const a = p[0];

  return pageHead('Users & profiles', 'Who can sign in, and what each profile allows.', '<button class="btn pri" data-act="soon-invite">Invite user</button>') +
    `<div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Profile</th><th>Status</th><th>Last active</th></tr></thead><tbody>${SM.users.map((u) => `<tr><td><b>${h(u.name)}</b> ${u.owner ? '<span class="pill or">Owner</span>' : ''}</td><td>${h(u.email)}</td><td>${h(u.profile)}</td><td><span class="pill ${u.status === 'Active' ? 'ok' : 'off'}">${h(u.status)}</span></td><td>${h(u.last)}</td></tr>`).join('')}</tbody></table></div>
    <h2 style="margin:28px 0 12px">Profiles</h2><div class="cards3">${SM.profiles.map((p) => `<div class="card"><h3>${h(p.name)}</h3><p class="note" style="margin:6px 0 10px">${h(p.note)}</p><span class="pill">${p.people} ${p.people === 1 ? 'person' : 'people'}</span></div>`).join('')}</div>`;
}
function auditV() {
  return pageHead('Audit log', 'Every change to portal settings, with who did it.') +
    `<div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Detail</th></tr></thead><tbody>${SM.audit.map((a) => `<tr><td>${h(a.when)}</td><td>${h(a.who)}</td><td><b>${h(a.what)}</b></td><td>${h(a.detail)}</td></tr>`).join('')}</tbody></table></div>`;
}
function prefsV() {
  const rows = [['digest', 'Daily digest email', 'A morning summary of what changed on your projects.'], ['mentions', 'Notify me when I am mentioned', 'In comments and descriptions.'], ['compact', 'Compact tables', 'Show more rows on screen.'], ['beta', 'Try new features early', 'Opt in to features still being tested.']];
  return pageHead('My preferences', 'These only change your own view.') +
    `<div class="card" style="max-width:720px">${rows.map(([k, t, d]) => `<div class="pref"><div><b>${t}</b><p>${d}</p></div><label class="sw"><input type="checkbox" role="switch" data-pref="${k}" ${S.prefs[k] ? 'checked' : ''} aria-label="${t}"><i></i></label></div>`).join('')}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target;
  const mb = t.closest('[data-menu]');
  if (mb) {
    const m = mb.nextElementSibling, was = !m.hidden; closeMenus();
    if (!was) { m.hidden = false; mb.setAttribute('aria-expanded', 'true'); const r = mb.getBoundingClientRect(); m.style.top = (r.bottom + 4) + 'px'; m.style.left = Math.max(8, r.right - m.offsetWidth) + 'px'; }
    return;
  }
  if (!t.closest('.menu')) closeMenus(); else setTimeout(closeMenus);
  if (!t.closest('.search')) $('#sres').hidden = true;
  const el = t.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, key = el.dataset.key, B = S.B;
  switch (a) {
    case 'drawer': { const o = !$('#side').classList.contains('open'); $('#side').classList.toggle('open', o); $('#bd').classList.toggle('open', o); $('[data-act=drawer]').setAttribute('aria-expanded', o); break; }
    case 'grp': S.open[id] = !S.open[id]; renderNav(parse()); break;
    case 'create-layout': case 'clone-layout': layoutDialogs(a, id); break;
    case 'edit-layout': location.hash = '#/projects/layouts/' + id; break;
    case 'default-layout': try { SM.setDefault(id); toast('Default layout updated'); } catch (x) { toast(x.message, true); } renderView(); break;
    case 'toggle-layout': try { SM.setActive(id, el.dataset.on === 'true'); toast(el.dataset.on === 'true' ? 'Layout activated' : 'Layout deactivated'); } catch (x) { toast(x.message, true); } renderView(); break;
    case 'create-field': newFieldDialog(() => renderView()); break;
    case 'toggle-field-status': { const f = SM.field(key); f.status = f.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'; toast(`${f.label} ${f.status === 'ACTIVE' ? 'activated' : 'deactivated'}`); renderView(); break; }
    case 'soon-invite': toast('Inviting users arrives with the Users module'); break;
    case 'mode': B.mode = el.dataset.m; bRender(); break;
    case 'b-save': bSave(); break;
    case 'b-cancel': bCancel(); break;
    case 'add-section': { const s = SM.draft.addSection(B.d, uniqueSectionName(B.d, 'New section')); bRender(); const i = $(`[data-sec-name="${s.id}"]`); i.focus(); i.select(); break; }
    case 'sec-up': case 'sec-down': SM.draft.shiftSection(B.d, +el.dataset.i, a === 'sec-up' ? -1 : 1); bRender(); break;
    case 'sec-rename': { const i = $(`[data-sec-name="${el.dataset.sec}"]`); i.focus(); i.select(); break; }
    case 'sec-del': {
      const s = B.d.sections.find((x) => x.id === el.dataset.sec), run = () => { try { SM.draft.removeSection(B.d, s.id); bRender(); toast('Section deleted'); } catch (x) { bRender(x.message); } };
      if (s.fields.length) confirmDlg('Delete section?', `"${s.name}" has ${s.fields.length} propert${s.fields.length > 1 ? 'ies' : 'y'}. They move back to Available properties.`, 'Delete section', run); else run(); break;
    }
    case 'toggle-field': B.open = B.open === key ? null : key; bRender(); $(`[data-key="${key}"] .fmain`)?.focus(); break;
    case 'remove-field': SM.draft.move(B.d, key, 'unplaced'); if (B.open === key) B.open = null; bRender(); break;
    case 'new-field': newFieldDialog(() => { $('#avlist').innerHTML = availList(); }); break;
  }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  if (f.dataset.form === 'status') { try { SM.addStatus(f.n.value); toast('Status added'); renderView(); } catch (x) { toast(x.message, true); } }
  if (f.dataset.form === 'portal') { const p = SM.portal; Object.assign(p, { name: f.name.value, timeZone: f.tz.value, dateFormat: f.df.value, currency: f.cur.value, weekStart: f.ws.value }); toast('Portal profile saved'); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'fq') { S.fq = t.value; $('#frows').innerHTML = fieldRows(); }
  else if (t.id === 'avq') { S.B.q = t.value; $('#avlist').innerHTML = availList(); }
  else if (t.id === 'bname') { S.B.d.name = t.value; refreshDirty(); }
  else if (t.id === 'gs') searchGo(t.value);
});
document.addEventListener('change', (e) => {
  const t = e.target, B = S.B;
  if (t.dataset.pref) { S.prefs[t.dataset.pref] = t.checked; toast('Preference saved'); }
  if (!B) return;
  if (t.dataset.secName) {
    const s = B.d.sections.find((x) => x.id === t.dataset.secName), v = t.value.trim();
    if (!v) return bRender('A section needs a name.');
    if (B.d.sections.some((x) => x !== s && x.name.trim().toLowerCase() === v.toLowerCase())) return bRender(`A section called "${v}" already exists. Section names must be unique.`);
    s.name = v; bRender();
  } else if (t.dataset.secColl) { B.d.sections.find((x) => x.id === t.dataset.secColl).collapsible = t.checked; refreshDirty(); }
  else if (t.dataset.moveto !== undefined) {
    const v = t.value; if (!v) return;
    SM.draft.move(B.d, t.dataset.key, v === '__un' ? 'unplaced' : v); if (v === '__un' && B.open === t.dataset.key) B.open = null;
    bRender('', `[data-key="${t.dataset.key}"] [data-moveto]`);
  } else if (t.dataset.ov) {
    const k = t.dataset.key, o = t.dataset.ov;
    if (o === 'mandatory') { SM.draft.override(B.d, k, { mandatory: t.value === '' ? null : t.value === 'true' }); bRender('', `[data-ov=mandatory]`); }
    else if (o === 'readOnly') { SM.draft.override(B.d, k, { readOnly: t.checked }); bRender('', `[data-ov=readOnly]`); }
    else { SM.draft.override(B.d, k, { defaultValue: t.value.trim() || null }); const at = SM.draft.find(B.d, k); $(`[data-key="${k}"] .chips`).innerHTML = chipsFor(at.placement, SM.field(k)); refreshDirty(); }
  }
  if (t.id === 'bname') refreshDirty();
});
/* drag and drop */
let dragKey = null;
document.addEventListener('dragstart', (e) => {
  const row = e.target.closest?.('.frow[draggable]'); if (!row || !S.B) return;
  dragKey = row.closest('[data-key]').dataset.key; e.dataTransfer.setData('text/plain', dragKey); e.dataTransfer.effectAllowed = 'move'; row.classList.add('dragging');
});
document.addEventListener('dragover', (e) => {
  const z = dragKey && e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  $$('.over').forEach((x) => x !== z && x.classList.remove('over')); z.classList.add('over');
});
document.addEventListener('drop', (e) => {
  const z = dragKey && e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault();
  const to = z.dataset.drop, row = e.target.closest('.fitem'), before = to !== 'unplaced' && row && z.contains(row) && row.dataset.key !== dragKey ? row.dataset.key : null;
  const k = dragKey; dragKey = null;
  SM.draft.move(S.B.d, k, to, before); if (to === 'unplaced' && S.B.open === k) S.B.open = null;
  bRender();
});
document.addEventListener('dragend', () => { dragKey = null; $$('.over,.dragging').forEach((x) => x.classList.remove('over', 'dragging')); });
/* global search */
function searchGo(q) {
  const box = $('#sres'); q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; return; }
  const l = PAGES.filter((p) => (p.t + ' ' + p.k + ' ' + p.g).toLowerCase().includes(q)).slice(0, 7);
  box.innerHTML = l.length ? l.map((p, i) => `<a href="${p.h}" class="${i ? '' : 'hi'}">${h(p.t)}<small>${h(p.g)}</small></a>`).join('') : '<p>No settings match.</p>'; box.hidden = false;
}
$('#gs').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { const a = $('#sres a'); if (a) { location.hash = a.getAttribute('href'); $('#sres').hidden = true; e.target.value = ''; e.target.blur(); } }
  if (e.key === 'Escape') $('#sres').hidden = true;
});
$('#sres').addEventListener('click', () => { $('#sres').hidden = true; $('#gs').value = ''; });
addEventListener('hashchange', route);
if (!location.hash) location.replace(DEFAULT); else route();
</script>
</body>
