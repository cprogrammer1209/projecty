<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issues · Linear style · ProjectY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap">
<style>
:root{
  --bg:#fcfcfd;--side:#f6f6f8;--card:#fff;--bd:#e6e6ea;--bd2:#d6d6dc;--tx:#1f2023;--tx2:#44464d;--mut:#6b6f76;--mut2:#8e9199;
  --hover:rgba(20,20,30,.045);--sel:rgba(94,106,210,.11);--acc:#5e6ad2;--acc-t:#4d59c0;--danger:#cf4238;--ok:#2f9e6f;
  --pop-sh:0 12px 36px rgba(20,20,40,.14),0 2px 6px rgba(20,20,40,.06);--grp:#f4f4f6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141517;--side:#191a1d;--card:#1c1d20;--bd:#2b2c31;--bd2:#3a3b41;--tx:#ececef;--tx2:#c4c6cc;--mut:#9a9da6;--mut2:#7a7d86;
  --hover:rgba(255,255,255,.055);--sel:rgba(124,134,232,.16);--acc:#6e79dc;--acc-t:#9aa3f0;--danger:#ef6b61;--ok:#4cc08e;
  --pop-sh:0 14px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3);--grp:#191a1d;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:400 13px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;flex:none;line-height:1}
.av.none{background:transparent;border:1.5px dashed var(--bd2)}
.app{display:flex;height:100vh}
/* sidebar */
.side{width:244px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:auto}
.ws{display:flex;align-items:center;gap:8px;padding:4px 8px 10px;font-weight:600}
.ws .logo{width:20px;height:20px;border-radius:5px;background:var(--acc);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.ws .sp{flex:1}
.ibtn{width:26px;height:26px;border:0;background:none;border-radius:5px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ibtn:hover{background:var(--hover);color:var(--tx)}
.ni{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border:0;background:none;border-radius:6px;color:var(--tx2);width:100%;text-align:left;font-weight:450}
.ni:hover{background:var(--hover)}
.ni.on{background:var(--sel);color:var(--tx)}
.ni svg{width:15px;height:15px;color:var(--mut);flex:none}
.ni .n{margin-left:auto;font-size:11px;color:var(--mut2)}
.ng{font-size:11.5px;font-weight:500;color:var(--mut2);padding:14px 8px 4px;display:flex;align-items:center}
.ni.sub{padding-left:32px}
.tdot{width:15px;height:15px;border-radius:4px;background:#7c5cd6;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.kbd{font:500 10.5px/1 Inter,sans-serif;border:1px solid var(--bd2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--mut);background:var(--card);display:inline-block;min-width:18px;text-align:center}
.side .foot{margin-top:auto;padding:8px;font-size:11.5px;color:var(--mut2);display:flex;align-items:center;gap:6px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative}
.hdr{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--bd)}
.hdr .crumb{font-weight:500;display:flex;align-items:center;gap:6px}
.hdr .crumb span{color:var(--mut)}
.tabs{display:flex;gap:2px;margin-left:12px}
.tab{height:26px;padding:0 10px;border:1px solid transparent;background:none;border-radius:6px;color:var(--mut);font-weight:450}
.tab:hover{background:var(--hover);color:var(--tx)}
.tab.on{background:var(--sel);color:var(--tx);border-color:transparent}
.hdr .sp{flex:1}
.tb{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border:1px solid var(--bd);background:var(--card);border-radius:6px;color:var(--tx2);font-weight:450}
.tb:hover{background:var(--hover)}
.tb.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:500}
.tb.pri:hover{background:var(--acc-t)}
.tb svg{width:14px;height:14px}
.fbar{display:flex;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap;flex:none}
.fc{height:24px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:6px;padding:0 8px;font-size:12px;background:var(--card);color:var(--tx2)}
.fc b{font-weight:500;color:var(--tx)}
.fc.add{border-style:dashed;color:var(--mut)}
.fc:hover{background:var(--hover)}
.fsearch{height:24px;border:1px solid var(--bd);border-radius:6px;background:var(--card);padding:0 8px;width:170px;font-size:12px}
.scroll{flex:1;overflow:auto;position:relative}
/* list */
.gh{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 20px;background:var(--grp);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:2;cursor:pointer;font-weight:500}
.gh .cnt{color:var(--mut2);font-weight:450}
.gh .sp{flex:1}
.gh .gplus{opacity:0}
.gh:hover .gplus{opacity:1}
.gh .car{width:12px;height:12px;color:var(--mut2);transition:transform .1s}
.gh.fold .car{transform:rotate(-90deg)}
.row{display:flex;align-items:center;gap:10px;height:36px;padding:0 16px 0 14px;border-bottom:1px solid var(--bd);position:relative;cursor:default}
.row:hover{background:var(--hover)}
.row.focus{background:var(--sel);box-shadow:inset 2px 0 0 var(--acc)}
.row .pc{width:20px;height:20px;position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.row .pc .chk{position:absolute;inset:0;width:20px;height:20px;display:none;align-items:center;justify-content:center;background:var(--bg)}
.row:hover .pc .chk,.row.checked .pc .chk{display:flex}
.row:hover .pc>.pi,.row.checked .pc>.pi{visibility:hidden}
.cbx{width:14px;height:14px;border:1.5px solid var(--bd2);border-radius:4px;background:var(--card);display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.row.checked .cbx{background:var(--acc);border-color:var(--acc)}
.row .id{color:var(--mut);font-size:12.5px;width:62px;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.row .si{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:5px;padding:0;flex:none}
.row .si:hover,.row .pc button:hover,.row .asg:hover{background:var(--bd)}
.row .pc button{width:20px;height:20px;border:0;background:none;border-radius:5px;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
.row .ttl{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:450;cursor:pointer}
.row.done .ttl{color:var(--mut)}
.row .sub{font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:3px;border:1px solid var(--bd);border-radius:10px;padding:0 6px;flex:none;height:18px}
.lab{display:inline-flex;align-items:center;gap:5px;height:20px;border:1px solid var(--bd);border-radius:10px;padding:0 8px;font-size:11.5px;color:var(--tx2);flex:none}
.lab i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.row .sp{flex:1}
.row .proj{font-size:12px;color:var(--mut);display:inline-flex;align-items:center;gap:5px;flex:none;max-width:150px;overflow:hidden;white-space:nowrap}
.row .asg{width:24px;height:24px;border:0;background:none;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.row .dt{width:52px;text-align:right;font-size:12px;color:var(--mut);flex:none}
.dt.overdue,.due.overdue{color:var(--danger)}
.row .hint{visibility:hidden;display:flex;gap:4px;pointer-events:none;flex:none}
.row.focus .hint{visibility:visible}
.qrow{display:flex;align-items:center;gap:8px;height:34px;padding:0 20px;color:var(--mut2);border-bottom:1px solid var(--bd);border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--bd)}
.qrow:hover{background:var(--hover);color:var(--tx2)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:70px 20px;color:var(--mut);text-align:center}
.empty b{color:var(--tx);font-size:15px;font-weight:500}
.hints{flex:none;height:30px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 16px;color:var(--mut2);font-size:11.5px;overflow:hidden;white-space:nowrap}
.hints span{display:inline-flex;align-items:center;gap:5px}
.selbar{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd2);box-shadow:var(--pop-sh);border-radius:10px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:10px;z-index:20}
/* board */
.board{display:flex;gap:10px;padding:12px 16px;height:100%;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 276px;display:flex;flex-direction:column;max-height:100%;background:var(--grp);border-radius:10px;border:1px solid transparent}
.col.over{border-color:var(--acc);background:var(--sel)}
.col h3{margin:0;display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px;font-size:13px;font-weight:500}
.col h3 .cnt{color:var(--mut2);font-weight:450}
.col h3 .sp{flex:1}
.cards{overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 10px 8px;cursor:grab;box-shadow:0 1px 2px rgba(20,20,40,.04)}
.card:hover{border-color:var(--bd2)}
.card.dragging{opacity:.4}
.card .t1{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;margin-bottom:4px}
.card .t1 .sp{flex:1}
.card .ct{font-weight:450;line-height:1.4;cursor:pointer;margin-bottom:8px}
.card.done .ct{color:var(--mut)}
.card .t2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .t2 .sp{flex:1}
.card .t2 .due{font-size:11.5px;color:var(--mut)}
.colempty{color:var(--mut2);text-align:center;padding:10px;font-size:12px}
/* modal / peek / full */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,10,20,.22);display:flex;align-items:flex-start;justify-content:center;padding-top:9vh}
.scrim.peek{background:rgba(10,10,20,.12)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 24px 70px rgba(10,10,30,.28);width:min(760px,94vw);max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);color:var(--mut)}
.ph .sp{flex:1}
.ph b{color:var(--tx);font-weight:500}
.pbody{overflow:auto;padding:20px 28px 24px}
.ttl-in{width:100%;border:0;background:none;font-size:22px;font-weight:600;letter-spacing:-.02em;padding:0;line-height:1.3;resize:none;field-sizing:content;overflow:hidden;font-family:inherit;outline:0}
.desc{width:100%;border:0;background:none;resize:none;field-sizing:content;min-height:56px;padding:0;margin:8px 0 14px;line-height:1.6;color:var(--tx2);outline:0;font-family:inherit}
.desc::placeholder{color:var(--mut2)}
.props{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.pp{height:26px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:0 9px;color:var(--tx2);font-weight:450}
.pp:hover{background:var(--hover)}
.pp.mut{color:var(--mut)}
.secth{display:flex;align-items:center;gap:8px;margin:18px 0 6px;font-weight:500}
.secth .mut{color:var(--mut);font-weight:450}
.prog{width:44px;height:4px;border-radius:2px;background:var(--bd);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc)}
.srow{display:flex;align-items:center;gap:10px;height:34px;border-bottom:1px solid var(--bd);padding:0 4px}
.srow .sp{flex:1}
.srow.done .tt{color:var(--mut);text-decoration:line-through}
.sadd{display:flex;align-items:center;gap:8px;padding:6px 4px;color:var(--mut2)}
.sadd input{flex:1;border:0;background:none;outline:0}
.tl{margin-top:8px;display:flex;flex-direction:column;gap:12px}
.ev{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:12.5px}
.ev b{color:var(--tx2);font-weight:500}
.ev .when{margin-left:auto;font-size:11.5px;color:var(--mut2)}
.cmt{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;background:var(--card)}
.cmt .hd{display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:4px}
.cmt .hd .when{font-weight:400;color:var(--mut2);font-size:11.5px}
.cmt p{margin:0;color:var(--tx2);white-space:pre-wrap}
.cbox{border:1px solid var(--bd);border-radius:8px;margin-top:14px;padding:8px 12px;background:var(--card)}
.cbox textarea{width:100%;border:0;background:none;resize:none;outline:0;min-height:38px;font-family:inherit}
.cbox .r{display:flex;justify-content:flex-end}
/* full issue page */
.full{display:flex;flex:1;min-height:0}
.full .center{flex:1;overflow:auto}
.full .inner{max-width:740px;margin:0 auto;padding:36px 32px 60px}
.full .rside{width:288px;flex:none;border-left:1px solid var(--bd);padding:14px 16px;overflow:auto}
.rside h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--mut2)}
.rp{display:flex;align-items:center;gap:8px;width:100%;height:30px;border:0;background:none;border-radius:6px;padding:0 8px;margin:0 -8px;text-align:left;color:var(--tx2);font-weight:450}
.rp:hover{background:var(--hover)}
.rp.mut{color:var(--mut2)}
.rside input.cfin{width:100%;height:30px;border:0;background:none;border-radius:6px;padding:0 8px;margin:0 -8px;outline:0}
.rside input.cfin:hover{background:var(--hover)}
.rside input.cfin:focus{background:var(--card);box-shadow:0 0 0 1px var(--acc)}
.rside hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
/* popup */
.pop{position:fixed;z-index:90;min-width:210px;max-width:300px;background:var(--card);border:1px solid var(--bd);border-radius:9px;box-shadow:var(--pop-sh);padding:4px}
.pop-t{padding:6px 8px 2px;font-size:11.5px;color:var(--mut2)}
.pop-s{width:100%;height:30px;border:0;border-bottom:1px solid var(--bd);background:none;padding:0 8px;outline:0;margin-bottom:4px}
.pop-l{max-height:300px;overflow:auto}
.pop-i{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:0 8px;height:28px;border-radius:5px;text-align:left;color:var(--tx2)}
.pop-i:hover,.pop-i.hi{background:var(--hover)}
.pop-i.hi{background:var(--sel)}
.pop-tick{margin-left:auto;color:var(--mut)}
.pop-ck{width:14px;height:14px;border:1.5px solid var(--bd2);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff;flex:none}
.pop-i.on .pop-ck{background:var(--acc);border-color:var(--acc)}
.pop-e{padding:8px;color:var(--mut)}
.pop .di{display:flex;align-items:center;width:100%;border:0;background:none;padding:0 8px;height:28px;border-radius:5px;text-align:left;color:var(--tx2)}.pop .di:hover{background:var(--hover)}.pop .di.on{background:var(--sel)}
.pop .seg{display:flex;gap:4px;padding:6px 8px}
.pop .seg button{flex:1;height:28px;border:1px solid var(--bd);background:var(--card);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.pop .seg button.on{background:var(--sel);border-color:transparent}
.pal{width:min(560px,94vw);background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 24px 70px rgba(10,10,30,.3);overflow:hidden}
.pal input{width:100%;height:46px;border:0;border-bottom:1px solid var(--bd);background:none;padding:0 16px;font-size:14px;outline:0}
.pal .res{max-height:320px;overflow:auto;padding:6px}
.pal button{display:flex;align-items:center;gap:10px;width:100%;height:32px;border:0;background:none;border-radius:6px;padding:0 10px;text-align:left}
.pal button.hi,.pal button:hover{background:var(--sel)}
.pal .gl{padding:8px 10px 2px;font-size:11.5px;color:var(--mut2)}
#toast{position:fixed;left:50%;bottom:48px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.side{display:none}.full .rside{display:none}.row .proj{display:none}}
</style>
</head>

<div class="app">
  <nav class="side" id="side" aria-label="Workspace navigation"></nav>
  <main class="main" id="main"></main>
</div>

}

    m.innerHTML = header() + `<div class="scroll" id="scroll">${S.page === 'board' ? renderBoard(its, key) : renderList(its, key)}</div>` +
      (S.checked.size ? `<div class="selbar">${S.checked.size} selected <button class="tb" data-act="closesel">Mark Done</button><button class="ibtn" data-act="clearsel" aria-label="Clear selection">${ic('x')}</button></div>` : '') +
      `<div class="hints">${S.page === 'board' ? '<span>Drag cards between columns</span>' : '<span><span class="kbd">J</span><span class="kbd">K</span> move</span><span><span class="kbd">Space</span> peek</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">S</span> status</span><span><span class="kbd">P</span> priority</span><span><span class="kbd">A</span> assign</span>'}<span><span class="kbd">C</span> create</span><span><span class="kbd">Ctrl</span><span class="kbd">K</span> commands</span></div>`;
    const s = $('#scroll'); if (s) s.scrollTop = sc;
  }
  let ov = $('#overlay'); if (!ov) { ov = document.createElement('div'); ov.id = 'overlay'; document.body.appendChild(ov); }
  ov.innerHTML = (S.peek && TM.get(S.peek) ? peekHtml(TM.get(S.peek)) : '') + (S.modal ? newModal() : '') + (S.pal ? palHtml() : '');
  const f = $('#ntitle'); if (f && S.modal && !S.modal.touched) { f.focus(); S.modal.touched = true; }
  const pq = $('#palq'); if (pq) { pq.focus(); pq.setSelectionRange(pq.value.length, pq.value.length); }
  document.querySelectorAll('textarea.ttl-in,textarea.desc,textarea#cmt').forEach(() => 0);
}

/* ---- pickers ---- */
function pick(kind, id, anchor, onSet) {
  const t = TM.get(id) || {}; const set = onSet || ((patch) => TM.update(id, patch));
  const nums = (i) => `<span class="kbd" style="margin-left:auto;border-width:1px">${i + 1}</span>`;
  if (kind === 'status') return TM.pop(anchor, { search: 'Change status…', items: TM.statuses.map((s, i) => ({ id: s.id, on: t.status === s.id, html: statusIcon(s.id) + esc(s.name) + nums(i), text: s.name })), onPick: (v) => set({ status: v }) });
  if (kind === 'priority') return TM.pop(anchor, { search: 'Set priority…', items: TM.priorities.slice().sort((a, b) => b.rank - a.rank).map((p, i) => ({ id: p.id, on: t.priority === p.id, html: prioIcon(p.id) + (p.id === 'none' ? 'No priority' : esc(p.name)) + nums(i), text: p.name })), onPick: (v) => set({ priority: v }) });
  if (kind === 'owner') return TM.pop(anchor, { search: 'Assign to…', items: [{ id: 'none', on: !t.owner, html: TM.avatar(null, 18) + 'No assignee', text: 'No assignee' }].concat(TM.users.map((u) => ({ id: u.id, on: t.owner === u.id, html: TM.avatar(u.id, 18) + esc(u.name) + (u.id === TM.ME ? '<span style="margin-left:auto;color:var(--mut2);font-size:11px">You</span>' : ''), text: u.name }))), onPick: (v) => set({ owner: v === 'none' ? null : v }) });
  if (kind === 'list') return TM.pop(anchor, { search: 'Move to project…', items: TM.lists.map((l) => ({ id: l.id, on: t.list === l.id, html: `<span class="tdot" style="background:${l.color};width:14px;height:14px"></span>` + esc(l.name), text: l.name })), onPick: (v) => set({ list: v }) });
  if (kind === 'visible') return TM.pop(anchor, { items: ['Yes', 'No'].map((v) => ({ id: v, on: t.cf.visible === v, html: v })), onPick: (v) => set({ cf: { visible: v } }) });
  if (kind === 'tags') return TM.pop(anchor, { multi: true, search: 'Add labels…', items: TM.tags.map((x) => ({ id: x, on: t.tags.includes(x), html: lab(x), text: x })), onPick: (v) => TM.toggleTag(id, v) });
  if (kind === 'due') { const o = (n) => new Date(TM.today.getTime() + n * 86400000).toISOString().slice(0, 10); const opts = [['Today', o(0)], ['Tomorrow', o(1)], ['In a week', o(7)], ['In two weeks', o(14)], ['No due date', null]]; return TM.pop(anchor, { search: 'Set due date…', items: opts.map((x, i) => ({ id: i, html: ic('cal') + x[0] + (x[1] ? `<span style="margin-left:auto;color:var(--mut2);font-size:11px">${TM.fmtDate(x[1])}</span>` : ''), text: x[0], on: t.due === x[1] })), onPick: (i) => set({ due: opts[i][1] }) }); }
}

/* ---- events ---- */
const goIssue = (id) => { S.sel = id; S.page = 'issue'; S.peek = null; S.focus = id; render(); };
function move(delta) { if (!order.length) return; let i = order.indexOf(S.focus); i = i < 0 ? (delta > 0 ? 0 : order.length - 1) : Math.max(0, Math.min(order.length - 1, i + delta)); S.focus = order[i]; if (S.peek) S.peek = S.focus; if (S.page === 'issue') S.sel = S.focus; render(); const r = $(`[data-row="${S.focus}"]`); if (r) r.scrollIntoView({ block: 'nearest' }); }
function openNew(key, gid) {
  const d = { title: '', desc: '', status: 'open', priority: 'none', owner: null, list: 'dev', more: false };
  if (key === 'status') d.status = gid; if (key === 'priority') d.priority = gid; if (key === 'owner') d.owner = gid === 'none' ? null : gid; if (key === 'list') d.list = gid;
  S.modal = { draft: d }; render();
}
function pal(act) {
  S.pal = null;
  if (act === 'new') return openNew();
  if (act === 'mine') { S.page = 'mine'; return render(); }
  if (act === 'list') { S.page = 'list'; return render(); }
  if (act.startsWith('v-')) { S.page = act.slice(2); return render(); }
  if (act.startsWith('g-')) { S.group = act.slice(2); return render(); }
  if (act.startsWith('i:')) return goIssue(act.slice(2));
}
document.addEventListener('click', (e) => {
  const sc = e.target.closest('[data-scrim]');
  if (sc && e.target === sc) { if (sc.dataset.scrim === 'peek') S.peek = null; if (sc.dataset.scrim === 'modal') S.modal = null; if (sc.dataset.scrim === 'pal') S.pal = null; return render(); }
  const el = e.target.closest('[data-nav],[data-view],[data-act],[data-open],[data-fold],[data-pick],[data-subtog],[data-preset],[data-clearf],[data-new],[data-check],[data-nav-issue],[data-mpick],[data-pal],[data-row]');
  if (!el) return;
  const d = el.dataset;
  if (d.pal) return pal(d.pal);
  if (d.new) { e.stopPropagation(); const [k, g] = d.new.split(':'); return openNew(k, g); }
  if (d.fold !== undefined) { S.fold[d.fold] = !S.fold[d.fold]; return render(); }
  if (d.check) { S.checked.has(d.check) ? S.checked.delete(d.check) : S.checked.add(d.check); return render(); }
  if (d.pick) { e.stopPropagation(); const [k, id] = d.pick.split(':'); return pick(k, id, el); }
  if (d.mpick) { const dr = S.modal.draft; return pick(d.mpick, '', el, (p) => { Object.assign(dr, p); S.modal.title = $('#ntitle')?.value; dr.title = $('#ntitle').value; dr.desc = $('#ndesc').value; render(); }); }
  if (d.open) return S.peek || e.detail ? goIssue(d.open) : goIssue(d.open);
  if (d.nav) { S.page = d.nav; S.peek = null; return render(); }
  if (d.view) { S.page = d.view; return render(); }
  if (d.preset) { S.preset = d.preset; return render(); }
  if (d.clearf) { S.f[d.clearf] = []; return render(); }
  if (d.subtog) { const [id, i] = d.subtog.split(':'); return TM.toggleSub(id, +i); }
  if (d.navIssue) { const base = S.peek || S.sel; const ids = order.length ? order : TM.tasks.map((t) => t.id); const i = ids.indexOf(base) + +d.navIssue; if (ids[i]) { if (S.peek) S.peek = ids[i]; else S.sel = ids[i]; S.focus = ids[i]; render(); } return; }
  if (d.row !== undefined && !d.act) { S.focus = d.row; return render(); }
  switch (d.act) {
    case 'back': S.page = 'list'; return render();
    case 'new': return openNew();
    case 'palette': S.pal = { q: '', hi: 0 }; return render();
    case 'filter': return filterMenu(el);
    case 'display': TM.pop(el, { cls: 'disp', items: [] }); return displayMenu(el);
    case 'clearall': S.f = { q: '', status: [], owner: [], priority: [], tag: [] }; S.preset = 'all'; S.showSearch = false; return render();
    case 'closepeek': S.peek = null; return render();
    case 'expand': return goIssue(S.peek);
    case 'closemodal': S.modal = null; return render();
    case 'create': return createIssue();
    case 'comment': { const v = $('#cmt').value; if (v.trim()) { TM.addComment(S.page === 'issue' ? S.sel : S.peek, v); TM.toast('Comment posted'); } return; }
    case 'closesel': S.checked.forEach((id) => TM.update(id, { status: 'closed' })); S.checked.clear(); return render();
    case 'clearsel': S.checked.clear(); return render();
  }
});
function createIssue() {
  const dr = S.modal.draft; dr.title = $('#ntitle').value.trim(); dr.desc = $('#ndesc').value;
  if (!dr.title) { $('#ntitle').style.outline = '1px solid var(--danger)'; return TM.toast('Add a title first'); }
  const more = $('#more').checked; const t = TM.add({ title: dr.title, status: dr.status, priority: dr.priority, owner: dr.owner, list: dr.list }); TM.update(t.id, { desc: dr.desc }, true);
  S.modal = more ? { draft: Object.assign({}, dr, { title: '', desc: '', more: true }) } : null; S.focus = t.id; render(); TM.toast(t.id + ' created');
}
function filterMenu(anchor) {
  const sec = (anc, k, label, its) => TM.pop(anc, { multi: true, search: label, items: its.map((i) => Object.assign(i, { on: S.f[k].includes(i.id) })), onPick: (v, it) => { const a = S.f[k]; if (it.on) a.push(v); else a.splice(a.indexOf(v), 1); S.showSearch = true; render(); } });
  TM.pop(anchor, { title: 'Filter', items: [['status', 'Status'], ['owner', 'Assignee'], ['priority', 'Priority'], ['tag', 'Label']].map((x) => ({ id: x[0], html: x[1] })), onPick: (k) => {
    const anc = [...document.querySelectorAll('.hdr .tb')].find((b) => b.textContent.includes('Filter')) || anchor;
    setTimeout(() => {
      if (k === 'status') sec(anc, 'status', 'Status…', TM.statuses.map((s) => ({ id: s.id, html: statusIcon(s.id) + esc(s.name), text: s.name })));
      if (k === 'owner') sec(anc, 'owner', 'Assignee…', TM.users.map((u) => ({ id: u.id, html: TM.avatar(u.id, 18) + esc(u.name), text: u.name })).concat([{ id: 'none', html: TM.avatar(null, 18) + 'No assignee', text: 'No assignee' }]));
      if (k === 'priority') sec(anc, 'priority', 'Priority…', TM.priorities.map((p) => ({ id: p.id, html: prioIcon(p.id) + esc(p.name), text: p.name })));
      if (k === 'tag') sec(anc, 'tag', 'Label…', TM.tags.map((x) => ({ id: x, html: lab(x), text: x })));
    }, 0);
  } });
}
function displayMenu(anchor) {
  const el = document.querySelector('.pop.disp'); if (!el) return;
  const draw = () => {
    el.innerHTML = `<div class="pop-t">View</div><div class="seg"><button data-dv="list" class="${S.page !== 'board' ? 'on' : ''}">${ic('list')}List</button><button data-dv="board" class="${S.page === 'board' ? 'on' : ''}">${ic('board')}Board</button></div><div class="pop-t">Grouping</div><div class="pop-l">${GROUPS.map((g) => `<button class="di${S.group === g[0] ? ' on' : ''}" data-dg="${g[0]}">${g[1]}${S.group === g[0] ? '<span class="pop-tick">✓</span>' : ''}</button>`).join('')}</div>`;
  };
  draw();
  el.onclick = (e) => { const v = e.target.closest('[data-dv]'), g = e.target.closest('[data-dg]'); if (v) { S.page = v.dataset.dv; render(); draw(); } if (g) { S.group = g.dataset.dg; render(); draw(); } e.stopPropagation(); };
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { S.f.q = t.value; const p = t.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(p, p); }
  if (t.id === 'palq') { S.pal.q = t.value; S.pal.hi = 0; render(); }
  if (t.dataset.desc) TM.get(t.dataset.desc).desc = t.value;
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.title) TM.update(t.dataset.title, { title: t.value.trim() || TM.get(t.dataset.title).title }, true);
  if (t.dataset.cf) { const [k, id] = t.dataset.cf.split(':'); TM.update(id, { cf: { [k]: t.value === '' ? null : +t.value } }); }
});
document.addEventListener('keydown', (e) => {
  const t = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.pal = { q: '', hi: 0 }; return render(); }
  if (S.pal) {
    if (e.key === 'Escape') { S.pal = null; return render(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.pal.hi = Math.max(0, Math.min(S.pal.list.length - 1, S.pal.hi + (e.key === 'ArrowDown' ? 1 : -1))); return render(); }
    if (e.key === 'Enter' && S.pal.list[S.pal.hi]) { e.preventDefault(); return pal(S.pal.list[S.pal.hi].id); }
    return;
  }
  if (t.id === 'subin' && e.key === 'Enter') { TM.addSub(S.sel || S.peek, t.value); const n = $('#subin'); if (n) n.focus(); return; }
  if (t.dataset && t.dataset.title && e.key === 'Enter') { e.preventDefault(); t.blur(); return; }
  if (e.key === 'Enter' && S.modal && (e.ctrlKey || e.metaKey)) return createIssue();
  if (e.key === 'Escape') { if (document.querySelector('.pop')) return; if (S.modal) { S.modal = null; return render(); } if (typing) { t.blur(); return; } if (S.peek) { S.peek = null; return render(); } if (S.page === 'issue') { S.page = 'list'; return render(); } if (S.checked.size) { S.checked.clear(); return render(); } return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || S.modal) return;
  const k = e.key.toLowerCase();
  if (k === 'c') { e.preventDefault(); return openNew(); }
  if (S.page === 'board' || S.page === 'mine' && false) return;
  if (k === 'j' || k === 'arrowdown') { e.preventDefault(); return move(1); }
  if (k === 'k' || k === 'arrowup') { e.preventDefault(); return move(-1); }
  const target = S.peek || (S.page === 'issue' ? S.sel : S.focus);
  if (k === 'enter' && S.focus && S.page !== 'issue') return goIssue(S.peek || S.focus);
  if (k === ' ' && S.focus && S.page !== 'issue') { e.preventDefault(); S.peek = S.peek ? null : S.focus; return render(); }
  if (target && ['s', 'p', 'a'].includes(k)) { e.preventDefault(); const kind = { s: 'status', p: 'priority', a: 'owner' }[k]; const a = $(`[data-pick="${kind}:${target}"]`) || document.body; return pick(kind, target, a); }
});
TM.on(render);
TM.boardDnD($('#main'), (id, col) => { const k = S.group === 'none' ? 'status' : S.group; TM.moveTo(id, k, col); TM.toast(id + ' moved'); });
render();
</script>
</body>
</html>
