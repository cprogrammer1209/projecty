<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks · Zoho style · ProjectY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f73e0;--blue-d:#1a5fbd;--blue-t:#eaf2fd;--red:#e42527;--bg:#f5f6f8;--bd:#dde1e7;--bd2:#e9ecf0;--tx:#263238;--mu:#6b7785;--ok:#2f9e6f;--warn:#e8890c;--top:48px}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 "Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.ic{width:16px;height:16px;fill:currentColor;flex:none;vertical-align:middle}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;flex:none;line-height:1}
.av.none{background:#fff;border:1px dashed #b4bcc7}
/* top bar */
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--bd)}
.brand{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:20px;background:var(--red);border-radius:2px;display:inline-block}
.gsearch{position:relative;flex:0 1 320px;margin-left:24px}
.gsearch input{width:100%;height:30px;border:1px solid var(--bd);border-radius:4px;padding:0 8px 0 28px;background:var(--bg)}
.gsearch .ic{position:absolute;left:8px;top:7px;color:var(--mu)}
.top .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:600}
.shell{display:flex;align-items:flex-start}
/* sidebar */
.side{width:236px;flex:none;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;background:#fff;border-right:1px solid var(--bd);padding:8px 0 24px}
.ng{padding:10px 16px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.ni{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 16px 7px 13px;border-left:3px solid transparent;color:var(--tx);font-size:13px}
.ni:hover{background:var(--bg)}
.ni.sub{padding-left:38px;color:#44505c}
.ni.on{border-left-color:var(--red);background:var(--blue-t);color:var(--blue-d);font-weight:600}
.ni .badge{margin-left:auto;background:#e9ecf0;color:var(--mu);border-radius:10px;padding:0 7px;font-size:11px;font-weight:600}
.ni .dot{width:8px;height:8px;border-radius:2px;background:#7c5cd6}
/* main */
.main{flex:1;min-width:0}
.phead{background:#fff;border-bottom:1px solid var(--bd);padding:12px 24px 0}
.crumb{color:var(--mu);font-size:12px}
.crumb a{color:var(--blue);cursor:pointer}
.phead h1{margin:2px 0 0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.key{font-size:11px;font-weight:700;background:var(--blue-t);color:var(--blue-d);border-radius:3px;padding:1px 6px}
.tabs{display:flex;gap:2px;margin-top:8px}
.tab{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent}
.tab.on{color:var(--blue-d);border-bottom-color:var(--blue)}
.tab:hover:not(.on){color:var(--tx)}
.tools{display:flex;align-items:center;gap:8px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.btn{height:30px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;border-radius:4px;padding:0 10px;font-weight:600;color:var(--tx);white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn .mu{color:var(--mu);font-weight:400}
.btn.on{background:var(--blue-t);border-color:#b9d3f5;color:var(--blue-d)}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;height:28px;padding:0 10px;display:flex;align-items:center;gap:6px;font-weight:600;color:var(--mu)}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:var(--blue-t);color:var(--blue-d)}
.tsearch{position:relative}
.tsearch input{height:30px;width:190px;border:1px solid var(--bd);border-radius:4px;padding:0 8px 0 28px}
.tsearch .ic{position:absolute;left:8px;top:7px;color:var(--mu)}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 24px;background:#fafbfc;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.chip{height:26px;border:1px dashed #b9c2cf;background:#fff;border-radius:13px;padding:0 10px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.chip.act{border-style:solid;border-color:#b9d3f5;background:var(--blue-t);color:var(--blue-d);font-weight:600}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:600}
.body{padding:16px 24px 40px}
/* list */
.tbl{background:#fff;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.cols{--cols:30px 78px minmax(260px,1fr) 150px 66px 76px 96px 124px 56px}
.th,.tr{display:grid;grid-template-columns:var(--cols);align-items:center;padding:0 12px;column-gap:8px}
.th{height:34px;background:#f1f3f6;border-bottom:1px solid var(--bd);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
.gh{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:#fafbfc;border-bottom:1px solid var(--bd2);border-top:1px solid var(--bd2);font-weight:700;cursor:pointer;border-left:4px solid var(--gc,#9aa5b4)}
.gh:first-of-type{border-top:0}
.gh .car{transition:transform .12s;color:var(--mu)}
.gh.fold .car{transform:rotate(-90deg)}
.gh small{font-weight:400;color:var(--mu)}
.gh .cnt{background:#e9ecf0;color:var(--mu);border-radius:10px;padding:0 8px;font-size:11px;font-weight:600}
.gh .gadd{margin-left:auto;opacity:0;border:0;background:none;color:var(--blue);font-weight:600;display:flex;align-items:center;gap:4px}
.gh:hover .gadd{opacity:1}
.tr{min-height:40px;border-bottom:1px solid var(--bd2);background:#fff}
.tr:hover{background:#f7fafe}
.tr.sub{background:#fcfcfd;min-height:34px}
.tr.sub .tt{padding-left:30px;font-size:12.5px}
.tr.sel{background:var(--blue-t)}
.cb{width:15px;height:15px;border:1.5px solid #a9b3c1;border-radius:3px;background:#fff;padding:0;display:flex;align-items:center;justify-content:center;color:#fff}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb .ic{width:11px;height:11px}
.tid{color:var(--mu);font-size:12px}
.tt{display:flex;align-items:center;gap:6px;min-width:0}
.tt .name{color:var(--tx);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tt .name:hover{color:var(--blue);text-decoration:underline}
.tr.done .name{color:var(--mu);text-decoration:line-through;font-weight:400}
.tcar{border:0;background:none;padding:0;width:16px;height:16px;color:var(--mu);transition:transform .12s}
.tcar.open{transform:rotate(90deg)}
.tcar.ph{visibility:hidden}
.subc{font-size:11px;color:var(--mu);display:inline-flex;align-items:center;gap:3px;background:#f1f3f6;border-radius:3px;padding:0 5px;flex:none}
.tag{font-size:11px;background:#eef1f5;color:#4b5766;border-radius:3px;padding:0 6px;flex:none}
.cell{border:0;background:none;display:flex;align-items:center;gap:6px;min-height:26px;padding:0 4px;margin:0 -4px;border-radius:3px;text-align:left;min-width:0;width:100%}
.cell:hover{background:#e9eff8}
.cell .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.mut{color:#a0a9b6}
.due.overdue{color:var(--red);font-weight:600}
.due.today{color:var(--warn);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;border-radius:11px;padding:0 9px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 70%,#000);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.flag{color:var(--pc)}
.prog{height:5px;background:#e6e9ee;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.qa{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 52px;border-bottom:1px solid var(--bd2)}
.qa button.add{border:0;background:none;color:var(--blue);font-weight:600;display:flex;align-items:center;gap:4px;opacity:.85}
.qa button.add:hover{opacity:1;text-decoration:underline}
.qa input{flex:1;max-width:520px;height:28px;border:1px solid var(--blue);border-radius:4px;padding:0 8px;box-shadow:0 0 0 3px rgba(31,115,224,.15)}
.qa .hint{color:var(--mu);font-size:11px}
.empty{padding:36px 12px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:14px;margin-bottom:4px}
.gempty{padding:14px 12px 14px 52px;color:#98a2b0;border-bottom:1px solid var(--bd2);font-style:italic}
/* board */
.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.col{flex:0 0 280px;background:#eceff3;border-radius:6px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col.over{outline:2px dashed var(--blue);background:#e3edfb}
.col h3{margin:0;padding:10px 12px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;border-top:3px solid var(--c,#9aa5b4);border-radius:6px 6px 0 0}
.col h3 .cnt{margin-left:auto;font-weight:600;color:var(--mu)}
.cards{padding:0 8px 8px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:40px;flex:1}
.card{background:#fff;border:1px solid var(--bd);border-radius:5px;padding:10px;cursor:grab;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.card:hover{box-shadow:0 3px 10px rgba(20,30,50,.12);border-color:#c7d0dc}
.card.dragging{opacity:.4}
.card .ct{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
.card .cn{font-weight:600;margin:4px 0 8px;cursor:pointer;word-break:break-word}
.card .cn:hover{color:var(--blue)}
.card .cf{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);margin-top:6px}
.card .cf .sp{flex:1}
.card.done .cn{text-decoration:line-through;color:var(--mu);font-weight:400}
.colqa{padding:0 8px 10px}
.colqa .addc{width:100%;border:1px dashed #b9c2cf;background:transparent;border-radius:5px;height:32px;color:var(--mu);font-weight:600}
.colqa .addc:hover{background:#fff;color:var(--blue)}
.colqa input{width:100%;height:30px;border:1px solid var(--blue);border-radius:4px;padding:0 8px}
/* detail */
.dhead{background:#fff;border-bottom:1px solid var(--bd);padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dhead .back{border:0;background:none;color:var(--blue);font-weight:600;display:flex;align-items:center;gap:4px;padding:0}
.dhead .nav{display:flex;gap:2px}
.dhead .nav button{width:28px;height:28px;border:1px solid var(--bd);background:#fff;border-radius:4px;color:var(--mu)}
.dhead .nav button:disabled{opacity:.4}
.dgrid{display:grid;grid-template-columns:290px minmax(0,1fr) 360px;gap:16px;padding:16px 24px 40px;align-items:start}
.panel{background:#fff;border:1px solid var(--bd);border-radius:6px}
.panel>h4{margin:0;padding:11px 14px;border-bottom:1px solid var(--bd2);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;justify-content:space-between}
.prop{display:grid;grid-template-columns:100px 1fr;align-items:center;padding:5px 14px;min-height:36px;border-bottom:1px solid #f1f3f6;gap:6px}
.prop:last-child{border-bottom:0}
.prop label{color:var(--mu);font-size:12px}
.prop .cell{padding:2px 6px;margin:0 -6px}
.prop input.in{width:100%;height:28px;border:1px solid transparent;border-radius:3px;background:none;padding:0 6px;margin:0 -6px}
.prop input.in:hover{border-color:var(--bd)}
.prop input.in:focus{border-color:var(--blue);background:#fff}
.title-in{field-sizing:content;resize:none;overflow:hidden;font-family:inherit;width:100%;border:1px solid transparent;border-radius:4px;font-size:20px;font-weight:600;padding:6px 8px;margin:-6px -8px 4px;background:none}
.title-in:hover{border-color:var(--bd)}
.title-in:focus{border-color:var(--blue);background:#fff;outline:0}
.sect{padding:14px 18px;border-bottom:1px solid var(--bd2)}
.sect:last-child{border-bottom:0}
.sect h5{margin:0 0 8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.desc{white-space:pre-wrap;color:#37454f;min-height:40px;padding:6px 8px;margin:0 -8px;border:1px solid transparent;border-radius:4px;cursor:text}
.desc:hover{border-color:var(--bd);background:#fafbfc}
.desc.ph{color:#a0a9b6}
textarea.desc-in{width:100%;min-height:90px;border:1px solid var(--blue);border-radius:4px;padding:6px 8px;resize:vertical}
.subrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #f1f3f6}
.subrow span.t{flex:1}
.subrow.done span.t{text-decoration:line-through;color:var(--mu)}
.subadd{display:flex;gap:8px;margin-top:8px}
.subadd input{flex:1;height:30px;border:1px solid var(--bd);border-radius:4px;padding:0 8px}
.drop{border:1.5px dashed #c3ccd8;border-radius:6px;padding:18px;text-align:center;color:var(--mu);background:#fafbfc}
.rtabs{display:flex;border-bottom:1px solid var(--bd);padding:0 6px;overflow:auto}
.rtabs button{border:0;background:none;padding:11px 10px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
.rtabs button.on{color:var(--blue-d);border-bottom-color:var(--blue)}
.cm{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #f1f3f6}
.cm .who{font-weight:600}
.cm .when{color:var(--mu);font-size:11px;margin-left:6px}
.cm p{margin:3px 0 0;white-space:pre-wrap}
.composer{padding:12px 14px}
.composer textarea{width:100%;min-height:64px;border:1px solid var(--bd);border-radius:4px;padding:8px;resize:vertical}
.composer .row{display:flex;justify-content:flex-end;margin-top:8px}
.act{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid #f1f3f6;font-size:12.5px}
.act .when{color:var(--mu);font-size:11px}
.etab{padding:28px 14px;text-align:center;color:var(--mu)}
.etab b{display:block;color:var(--tx);margin-bottom:2px}
/* popup (shared helper) */
.pop{position:fixed;z-index:80;min-width:190px;max-width:280px;background:#fff;border:1px solid var(--bd);border-radius:6px;box-shadow:0 8px 24px rgba(20,30,50,.18);padding:4px}
.pop-t{padding:6px 10px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mu);letter-spacing:.05em}
.pop-s{width:calc(100% - 8px);margin:2px 4px 4px;height:28px;border:1px solid var(--bd);border-radius:4px;padding:0 8px}
.pop-l{max-height:280px;overflow:auto}
.pop-i{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 10px;border-radius:4px;text-align:left}
.pop-i:hover,.pop-i.hi{background:var(--blue-t)}
.pop-i.on{font-weight:600}
.pop-tick{margin-left:auto;color:var(--blue)}
.pop-ck{width:15px;height:15px;border:1.5px solid #a9b3c1;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.pop-i.on .pop-ck{background:var(--blue);border-color:var(--blue)}
.pop-e{padding:8px 10px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#263238;color:#fff;padding:8px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1180px){.dgrid{grid-template-columns:260px 1fr}.dgrid>:last-child{grid-column:1/-1}}
@media(max-width:900px){.side{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i></i>ProjectY</div>
  <div class="gsearch"><svg class="ic"><use href="#i-search"/></svg><input placeholder="Search tasks, projects, people" aria-label="Search"></div>
  <div class="me"><span id="meav"></span>Asha Rao</div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Portal navigation"></nav>
  <main class="main" id="main"></main>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></symbol>
<symbol id="i-car" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zM3 17h2v2H3zm4 0h14v2H7z"/></symbol>
<symbol id="i-board" viewBox="0 0 24 24"><path d="M4 4h4.5v16H4zm5.8 0h4.4v10H9.8zm5.7 0H20v13h-4.5z"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
<symbol id="i-task" viewBox="0 0 24 24"><path d="M19 3h-4.2A3 3 0 0 0 9.2 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-2 14l-4-4 1.4-1.4L10 14.2l6.6-6.6L18 9z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14z"/></symbol>
<symbol id="i-sub" viewBox="0 0 24 24"><path d="M6 3v10a3 3 0 0 0 3 3h5v3l5-4-5-4v3H9a1 1 0 0 1-1-1V3z"/></symbol>
<symbol id="i-filter" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4zM3 6v2h18V6zm3 7h12v-2H6z"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></symbol>
</defs></svg>
<script src="task-model.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = TM.esc;
const ic = (n, cls = '') => `<svg class="ic ${cls}"><use href="#i-${n}"/></svg>`;
const PRIO_COLOR = { none: '#b4bcc7', low: '#2f9e6f', medium: '#e8890c', high: '#e42527', urgent: '#e42527' };
// Zoho Projects has four priorities: Urgent is shown as High here
const PRIO_LABEL = { none: 'None', low: 'Low', medium: 'Medium', high: 'High', urgent: 'High' };
const VIEWS = [['all', 'All Tasks'], ['open', 'All Open Tasks'], ['mine', 'My Open Tasks'], ['overdue', 'Overdue Tasks'], ['closed', 'Closed Tasks']];
const GROUPS = [['list', 'Task List'], ['status', 'Status'], ['owner', 'Owner'], ['priority', 'Priority'], ['due', 'Due date'], ['none', 'None']];
const S = { page: 'list', view: 'all', gList: 'list', gBoard: 'status', f: { q: '', status: [], owner: [], priority: [], tag: [] }, showF: false, fold: {}, open: {}, qa: null, sel: null, tab: 'comments', editDesc: false, focus: null };

function applyView(items) {
  const v = S.view;
  return items.filter((t) => v === 'all' || (v === 'open' && !TM.isClosed(t)) || (v === 'mine' && t.owner === TM.ME && !TM.isClosed(t)) || (v === 'overdue' && TM.dueInfo(t).cls === 'overdue') || (v === 'closed' && TM.isClosed(t)));
}
function visibleTasks() {

function subRows(t) {

    <div class="cell" style="cursor:default">${TM.avatar(s.owner, 20)}<span class="nm">${esc(TM.user(s.owner)?.name || '')}</span></div><span></span><span></span><span></span><span></span><span></span></div>`).join('');
}
function taskRow(t, extra) {
  const d = TM.dueInfo(t), st = TM.status(t.status), u = TM.user(t.owner);
  const dn = t.subtasks.filter((s) => s.done).length, pct = t.subtasks.length ? Math.round(dn / t.subtasks.length * 100) : (TM.isClosed(t) ? 100 : 0);
  return `<div class="tr${TM.isClosed(t) ? ' done' : ''}" data-row="${t.id}">
    <button class="cb${TM.isClosed(t) ? ' on' : ''}" data-close="${t.id}" aria-label="Mark complete">${TM.isClosed(t) ? ic('check') : ''}</button>

    <div class="tt"><button class="tcar${t.subtasks.length ? '' : ' ph'}${S.open[t.id] ? ' open' : ''}" data-exp="${t.id}" aria-label="Show sub tasks">${ic('car')}</button><span class="name" data-open="${t.id}" title="${esc(t.title)}">${esc(t.title)}</span>${t.subtasks.length ? `<span class="subc">${ic('sub')}${dn}/${t.subtasks.length}</span>` : ''}${t.tags.slice(0, 2).map((x) => `<span class="tag">${esc(x)}</span>`).join('')}</div>

function quickAdd(key, gid) {

  return `<div class="tbl cols"><div class="th"><span></span><span>ID</span><span>Task</span><span>Owner</span><span>Start</span><span>Due</span><span>Priority</span><span>Status</span><span>Done</span></div>` +

function renderBoard(items, key) {

  <div class="dgrid">
    <section class="panel"><h4>Details</h4>

      ${row('Task list', `<button class="cell" data-pick="list:${t.id}"><span class="nm">${esc(l.name)}</span></button>`)}

      ${row('Tags', `<button class="cell" data-pick="tags:${t.id}">${t.tags.length ? t.tags.map((x) => `<span class="tag">${esc(x)}</span>`).join(' ') : '<span style="color:#a0a9b6">Add tags</span>'}</button>`)}
      ${row('Created by', `${TM.avatar(t.creator, 20)} ${esc(TM.user(t.creator).name)}`)}

      <div class="sect"><h5>Description</h5>${S.editDesc ? `<textarea class="desc-in" id="descin" aria-label="Description">${esc(t.desc)}</textarea><div style="margin-top:6px;display:flex;gap:6px"><button class="btn pri" data-act="savedesc">Save</button><button class="btn" data-act="canceldesc">Cancel</button></div>` : `<div class="desc${t.desc ? '' : ' ph'}" data-act="editdesc" tabindex="0">${t.desc ? esc(t.desc) : 'Click to add a description'}</div>`}</div>

        ${t.subtasks.map((s, i) => `<div class="subrow${s.done ? ' done' : ''}"><button class="cb${s.done ? ' on' : ''}" data-subtog="${t.id}:${i}" aria-label="Toggle">${s.done ? ic('check') : ''}</button><span class="tid">${s.id}</span><span class="t">${esc(s.title)}</span>${TM.avatar(s.owner, 22)}</div>`).join('')}
        <div class="subadd"><input id="subin" placeholder="Add a sub task and press Enter" aria-label="New sub task"></div></div>

function render() {
  renderSide();
  $('#meav').innerHTML = TM.avatar(TM.ME, 28);
  const m = $('#main');
  const keepScroll = m.scrollTop;
  if (S.page === 'detail') { m.innerHTML = headerBlock('Tasks') + renderDetail(); }
  else if (S.page === 'dash' || S.page === 'stub') { m.innerHTML = headerBlock('') + `<div class="body"><div class="tbl"><div class="empty"><b>Not part of this sample</b>Only the Tasks screens are explored here.</div></div></div>`; }
  else {
    const items = visibleTasks();
    const key = S.page === 'mine' ? 'due' : S.page === 'board' ? S.gBoard : S.gList;
    if (S.page === 'mine') m.innerHTML = `<div class="phead"><div class="crumb">Portal</div><h1>My Tasks <span class="key">All projects</span></h1><div class="tabs"><button class="tab on">Assigned to me</button><button class="tab">Created by me</button><button class="tab">Following</button></div></div>` + toolbar() + `<div class="body">${renderList(items, key)}</div>`;
    else m.innerHTML = headerBlock('Tasks') + toolbar() + `<div class="body">${S.page === 'board' ? renderBoard(items, key) : renderList(items, key)}</div>`;
  }
  m.scrollTop = keepScroll;
  const q = $('#qai'); if (q) q.focus();
  if (S.focus) { const f = $(S.focus); if (f) { f.focus(); f.setSelectionRange?.(f.value.length, f.value.length); } S.focus = null; }
}
function headerBlock(active) {
  if (S.page === 'detail') return '';
  return `<div class="phead"><div class="crumb"><a data-nav="home">Projects</a> / Website Revamp</div><h1>Website Revamp <span class="key">WEB</span></h1>
    <div class="tabs">${['Overview', 'Milestones', 'Tasks', 'Issues', 'Documents', 'Time'].map((x) => `<button class="tab${x === active ? ' on' : ''}" data-nav="${x === 'Tasks' ? 'list' : 'stub'}">${x}</button>`).join('')}</div></div>`;
}

// ---- pickers ----
function pick(kind, id, anchor) {
  const t = TM.get(id); if (!t) return;
  const go = (patch) => TM.update(id, patch);
  if (kind === 'status') return TM.pop(anchor, { title: 'Status', items: TM.statuses.map((s) => ({ id: s.id, on: t.status === s.id, html: pill(s) + `<span style="color:var(--mu);font-size:11px;margin-left:auto">${s.type}</span>` })), onPick: (v) => go({ status: v }) });
  if (kind === 'owner') return TM.pop(anchor, { title: 'Owner', search: 'Search people', items: [{ id: 'none', on: !t.owner, html: `${TM.avatar(null, 22)}Unassigned`, text: 'Unassigned' }].concat(TM.users.map((u) => ({ id: u.id, on: t.owner === u.id, html: TM.avatar(u.id, 22) + esc(u.name), text: u.name }))), onPick: (v) => go({ owner: v === 'none' ? null : v }) });
  if (kind === 'priority') return TM.pop(anchor, { title: 'Priority', items: TM.priorities.filter((p) => p.id !== 'urgent').map((p) => ({ id: p.id, on: PRIO_LABEL[t.priority] === p.name, html: prioHtml(p.id) + p.name })), onPick: (v) => go({ priority: v }) });
  if (kind === 'list') return TM.pop(anchor, { title: 'Task list', items: TM.lists.map((l) => ({ id: l.id, on: t.list === l.id, html: esc(l.name) })), onPick: (v) => go({ list: v }) });
  if (kind === 'visible') return TM.pop(anchor, { title: 'Customer visible', items: ['Yes', 'No'].map((v) => ({ id: v, on: t.cf.visible === v, html: v })), onPick: (v) => go({ cf: { visible: v } }) });
  if (kind === 'tags') return TM.pop(anchor, { title: 'Tags', multi: true, items: TM.tags.map((x) => ({ id: x, on: t.tags.includes(x), html: esc(x) })), onPick: (v) => TM.toggleTag(id, v) });
  if (kind === 'due') { const o = (n) => { const d = new Date(TM.today.getTime() + n * 86400000); return d.toISOString().slice(0, 10); }; return TM.pop(anchor, { title: 'Due date', items: [['today', 'Today', o(0)], ['tom', 'Tomorrow', o(1)], ['week', 'Next week', o(7)], ['two', 'In two weeks', o(14)], ['none', 'No due date', null]].map((x) => ({ id: x[0], html: x[1] + (x[2] ? `<span style="margin-left:auto;color:var(--mu);font-size:11px">${TM.fmtDate(x[2])}</span>` : ''), on: t.due === x[2] })), onPick: (v, it) => go({ due: v === 'none' ? null : [['today', o(0)], ['tom', o(1)], ['week', o(7)], ['two', o(14)]].find((x) => x[0] === v)[1] }) }); }
}

// ---- events ----
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-nav],[data-view],[data-act],[data-open],[data-exp],[data-fold],[data-pick],[data-close],[data-subtog],[data-qaopen],[data-fmenu],[data-tab],[data-nav-task]');
  if (!el) return;
  const d = el.dataset;
  if (d.fold !== undefined && !e.target.closest('.gadd')) { S.fold[d.fold] = !S.fold[d.fold]; return render(); }
  if (d.qaopen) { e.stopPropagation(); const [key, gid] = d.qaopen.split(':'); S.qa = { key, gid }; S.fold[key + gid] = false; return render(); }
  if (d.fold !== undefined) return;
  if (d.nav) { S.page = d.nav === 'mine' ? 'mine' : d.nav === 'list' ? (S.page === 'board' ? 'board' : 'list') : 'stub'; return render(); }
  if (d.view) { S.page = d.view; return render(); }
  if (d.open) { S.sel = d.open; S.page = 'detail'; S.editDesc = false; S.tab = 'comments'; scrollTo(0, 0); return render(); }
  if (d.exp) { S.open[d.exp] = !S.open[d.exp]; return render(); }
  if (d.pick) { e.stopPropagation(); const [k, id] = d.pick.split(':'); return pick(k, id, el); }
  if (d.close) { const t = TM.get(d.close); return TM.update(d.close, { status: TM.isClosed(t) ? 'open' : 'closed' }); }
  if (d.subtog) { const [id, i] = d.subtog.split(':'); return TM.toggleSub(id, +i); }
  if (d.tab) { S.tab = d.tab; return render(); }
  if (d.navTask) { const l = TM.tasks.slice().sort((a, b) => a.order - b.order); const i = l.findIndex((x) => x.id === S.sel) + +d.navTask; if (l[i]) { S.sel = l[i].id; S.editDesc = false; render(); } return; }
  if (d.fmenu) { const k = d.fmenu; const src = k === 'owner' ? TM.users.map((u) => ({ id: u.id, html: TM.avatar(u.id, 20) + esc(u.name) })).concat([{ id: 'none', html: 'Unassigned' }]) : k === 'status' ? TM.statuses.map((s) => ({ id: s.id, html: pill(s) })) : k === 'priority' ? TM.priorities.filter((p) => p.id !== 'urgent').map((p) => ({ id: p.id, html: prioHtml(p.id) + p.name })) : TM.tags.map((x) => ({ id: x, html: esc(x) }));
    return TM.pop(el, { multi: true, items: src.map((i) => Object.assign(i, { on: S.f[k].includes(i.id) })), onPick: (v, it) => { const a = S.f[k]; if (it.on) a.push(v); else a.splice(a.indexOf(v), 1); render(); } }); }
  switch (d.act) {
    case 'back': S.page = 'list'; return render();
    case 'viewmenu': return TM.pop(el, { items: VIEWS.map((v) => ({ id: v[0], html: v[1], on: S.view === v[0] })), onPick: (v) => { S.view = v; render(); } });
    case 'groupmenu': return TM.pop(el, { title: 'Group by', items: GROUPS.filter((g) => S.page === 'board' ? g[0] !== 'due' && g[0] !== 'none' : true).map((g) => ({ id: g[0], html: g[1], on: (S.page === 'board' ? S.gBoard : S.gList) === g[0] })), onPick: (v) => { if (S.page === 'board') S.gBoard = v; else S.gList = v; render(); } });
    case 'togglef': S.showF = !S.showF; return render();
    case 'clearf': S.f = { q: S.f.q, status: [], owner: [], priority: [], tag: [] }; return render();
    case 'clearall': S.f = { q: '', status: [], owner: [], priority: [], tag: [] }; S.view = 'all'; return render();
    case 'addtask': { if (S.page === 'detail') return; if (S.page === 'mine') { TM.add({ title: 'New task', owner: TM.ME }); return TM.toast('Task added to Development'); } const key = S.page === 'board' ? S.gBoard : S.gList; const g = TM.groupBy(TM.tasks, key)[0]; S.qa = { key, gid: g.id }; S.fold[key + g.id] = false; render(); return; }
    case 'editdesc': S.editDesc = true; S.focus = '#descin'; return render();
    case 'canceldesc': S.editDesc = false; return render();
    case 'savedesc': TM.update(S.sel, { desc: $('#descin').value }, true); S.editDesc = false; return render();
    case 'comment': { const v = $('#cmt').value; if (v.trim()) { TM.addComment(S.sel, v); TM.toast('Comment added'); } return; }
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { S.f.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.title) TM.update(t.dataset.title, { title: t.value.trim() || TM.get(t.dataset.title).title }, true);
  if (t.dataset.cf) { const [k, id] = t.dataset.cf.split(':'); TM.update(id, { cf: { [k]: t.value === '' ? null : +t.value } }); }
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.qa) {
    if (e.key === 'Escape') { S.qa = null; render(); }
    if (e.key === 'Enter' && t.value.trim()) { const [key, gid] = t.dataset.qa.split(':'); TM.add(Object.assign({ title: t.value.trim() }, defaults(key, gid))); TM.toast('Task added'); S.focus = '#qai'; }
  }
  if (t.id === 'subin' && e.key === 'Enter') { TM.addSub(S.sel, t.value); S.focus = '#subin'; }
  if (t.dataset && t.dataset.title && e.key === 'Enter') t.blur();
  if (t.classList && t.classList.contains('desc') && e.key === 'Enter') { S.editDesc = true; S.focus = '#descin'; render(); }
});
TM.on(() => { render(); });
TM.boardDnD($('#main'), (id, col) => { const key = S.gBoard; TM.moveTo(id, key, col); const lbl = TM.groupBy(TM.tasks, key).find((g) => g.id === col); TM.toast(id + ' moved to ' + (lbl ? lbl.label : col)); });
render();
</script>
</body>
